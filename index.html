<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscando la Sexta - Misión Imposible</title>
    <style>
        /* Estilos en honor al Real Madrid (Blanco y Dorado) */
        body {
            background-color: #f4f4f7;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .contador-container {
            background-color: #ffffff;
            border: 2px solid #b3a164; /* Borde Dorado Madridista */
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            max-width: 550px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            font-size: 22px;
            color: #1e2a4a; /* Azul oscuro */
            margin-bottom: 25px; /* Más espacio al quitar el aviso */
        }

        /* Marcador de tiempo congelado */
        #contador {
            font-size: 20px;
            font-weight: bold;
            color: #1e2a4a;
            line-height: 1.6;
        }

        #contador span {
            color: #b3a164; /* Números en dorado */
            font-size: 22px;
        }

        .burlas {
            font-size: 12px;
            color: #70757a;
            margin-top: 25px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="contador-container">
        <h2>Tiempo esperando la Sexta del Barça: ⌛⏳</h2>
        
        <!-- El cronómetro principal se despliega aquí directamente -->
        <div id="contador">Calculando congelamiento...</div>
        
        <div class="burlas">"Operación VarNegreira en observación por la UEFA..."</div>
    </div>

    <script>
    // Fecha inmutable de la última Champions del Barça (6 de junio de 2015)
    const fechaChampions = new Date('2015-06-06T22:00:00');

    function actualizarReloj() {
        const ahora = new Date();

        if (ahora >= fechaChampions) {
            let anos = ahora.getFullYear() - fechaChampions.getFullYear();
            let meses = ahora.getMonth() - fechaChampions.getMonth();
            let dias = ahora.getDate() - fechaChampions.getDate();

            // Algoritmo matemático para meses de duración variable (28, 30 o 31 días)
            if (dias < 0) {
                meses--;
                const ultimoDiaMesAnterior = new Date(ahora.getFullYear(), ahora.getMonth(), 0).getDate();
                dias += ultimoDiaMesAnterior;
            }

            if (meses < 0) {
                anos--;
                meses += 12;
            }

            let totalSegundos = Math.floor((ahora - fechaChampions) / 1000);
            let horas = Math.floor((totalSegundos / 3600) % 24);
            let minutes = Math.floor((totalSegundos / 60) % 60);
            let segundos = totalSegundos % 60;

            document.getElementById('contador').innerHTML = 
                `<span>${anos} años</span>, 
                 <span>${meses} meses</span>, 
                 <span>${dias} días</span>, <br>
                 <span>${horas} horas</span>, 
                 <span>${minutes} minutos</span> y 
                 <span>${segundos} segundos</span>`;
        }
    }

    // Arrancamos el bucle del cronómetro inmediatamente a 1000ms (1 segundo)
    actualizarReloj();
    setInterval(actualizarReloj, 1000);
    </script>

</body>
</html>
