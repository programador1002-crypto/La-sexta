<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscando la Sexta - Misión Imposible</title>
    <style>
        /* Estilos en honor al Real Madrid (Blanco y Dorado) */
        body {
            background-color: #f4f4f7;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .contador-container {
            background-color: #ffffff;
            border: 2px solid #b3a164;
            /* Borde Dorado Madridista */
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            max-width: 550px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 22px;
            color: #1e2a4a;
            /* Azul oscuro */
            margin-bottom: 5px;
        }

        .estado-api {
            font-size: 11px;
            color: #70757a;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* Marcador de tiempo congelado */
        #contador {
            font-size: 20px;
            font-weight: bold;
            color: #1e2a4a;
            line-height: 1.6;
        }

        #contador span {
            color: #b3a164;
            /* Números en dorado */
            font-size: 22px;
        }

        .burlas {
            font-size: 12px;
            color: #70757a;
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="contador-container">
        <h2>Tiempo esperando la Sexta del Barça: ⌛⏳</h2>
        <div id="estado" class="estado-api">Conectando con servidores de la UEFA...</div>

        <div id="contador">Calculando congelamiento...</div>

        <div class="burlas">"Operación VarNegreira en observación por la UEFA..."</div>
    </div>

    <script>
        // Fecha de la última Champions del Barça (6 de junio de 2015)
        let fechaChampions = new Date('2015-06-06T22:00:00');

        // Tu Token de Football-Data.org
        const tokenAPI = 'a1b570968c674991a1b4ca1c2de053';

        async function conectarUEFA() {
            const url = 'https://football-data.org';

            try {
                const respuesta = await fetch(url, {
                    method: 'GET',
                    headers: { 'X-Auth-Token': tokenAPI }
                });

                if (!respuesta.ok) throw new Error("Error");
                const datos = await respuesta.json();

                // Sincronización exitosa
                document.getElementById('estado').style.color = "#2b732b";
                document.getElementById('estado').innerText = "✅ Sincronizado con la UEFA: Siguen congelados en 5 Champions.";

            } catch (error) {
                // Respaldo local
                document.getElementById('estado').style.color = "#1e2a4a";
                document.getElementById('estado').innerText = "ℹ️ Servidor UEFA en espera. Datos de la última Champions (2015) cargados.";
            }

            actualizarReloj();
            setInterval(actualizarReloj, 1000);
        }

        function actualizarReloj() {
            const ahora = new Date();

            if (ahora >= fechaChampions) {
                let anos = ahora.getFullYear() - fechaChampions.getFullYear();
                // CÓDIGO CORREGIDO:
                let meses = ahora.getMonth() - fechaChampions.getMonth();

                let dias = ahora.getDate() - fechaChampions.getDate();

                if (dias < 0) {
                    meses--;
                    const ultimoDiaMesAnterior = new Date(ahora.getFullYear(), ahora.getMonth(), 0).getDate();
                    dias += ultimoDiaMesAnterior;
                }

                if (meses < 0) {
                    anos--;
                    meses += 12;
                }

                let totalSegundos = Math.floor((ahora - fechaChampions) / 1000);
                let horas = Math.floor((totalSegundos / 3600) % 24);
                let minutos = Math.floor((totalSegundos / 60) % 60);
                let segundos = totalSegundos % 60;

                document.getElementById('contador').innerHTML =
                    `<span>${anos} años</span>, 
                 <span>${meses} meses</span>, 
                 <span>${dias} días</span>, <br>
                 <span>${horas} horas</span>, 
                 <span>${minutos} minutos</span> y 
                 <span>${segundos} segundos</span>`;
            }
        }

        window.onload = conectarUEFA;
    </script>

</body>

</html>
